<!-- 解答・解説表示画面 -->
{% extends 'base.html' %}
{% load static %}
{% block content %}

<!-- 未実装：
「次の問題へ」「解答終了」のurl -->

<div class="container vh-100">

    {% if is_correct %}
    <div class="h1 text-center text-danger">正解!</div>    
    {% else %}
    <div class="h1 text-center">残念…</div>    
    <div>あなたの解答：{{answer}}</div>
    <div>正解：{{correct_answer}}</div>
    {% endif %}
      
    
    <!-- <div class=mt-3>解説：</div>    
    <div class="border rounded h-50 overflow-auto mb-5">解説文</div> -->

      <div class="d-flex justify-content-center gap-3">
        <button type="button" class="btn btn-dark" href="{% url '次の問題へ' %}">次の問題へ</button>
        <button type="button" class="btn btn-secondary" href="{% url '解答終了' %}">解答終了</button>
        <button type="button" class="btn btn-danger" href="{% url 'home' %}">中断</button>
    </div>
    
</div>

{% endblock %}
