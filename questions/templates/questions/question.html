<!-- 出題・解答画面 -->
{% extends 'base.html' %}
{% load static %}
{% block content %}

<div class="container vh-100">
    <div class="h1 mb-2">第1問</div>
    
    <div class="h-50 border rounded overflow-auto">問題文</div>
    
    <form action="" method="POST" class="mt-5">
      
        <div class="d-flex align-items-center">
        <button type="submit" class="btn btn-dark" name="answer" value=0>ア</button>
        <div class="">アの選択肢</div>
      </div>
      
      <div class="d-flex align-items-center">
        <button type="submit" class="btn btn-dark" name="answer" value=1>イ</button>
        <div class="">イの選択肢</div>
      </div>    
      
      <div class="d-flex align-items-center">
        <button type="submit" class="btn btn-dark" name="answer" value=2>ウ</button>
        <div class="">ウの選択肢</div>
      </div> 
      
      <div class="d-flex align-items-center">
        <button type="submit" class="btn btn-dark" name="answer" value=3>エ</button>
        <div class="">エの選択肢</div>
      </div>
    
    </form>
  
    <div class="d-flex justify-content-center gap-3">
      <button type="button" class="btn btn-secondary" href="">解答終了</button>
      <button type="button" class="btn btn-danger" href="">中断</button>
    </div>
</div>

{% endblock %}
