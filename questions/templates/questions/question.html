<!-- 出題・解答画面 -->
{% extends 'base.html' %}
{% load static %}
{% block content %}

<div class="container vh-100">
    <div class="h1 mb-2">第{{ question_number }}問</div>
    
    <div class="h-50 border rounded overflow-auto">{{ question_content }}</div>
    
    <form action="{% url 'answer_save' question_id=question_id %}" method="POST" class="mt-5">
      {% csrf_token %}
      
      {% for index, choice in question_choices %}
        <div class="d-flex align-items-center">
          <button type="submit" class="btn btn-dark" name="answer" value="{{ index }}">{{ choice }}</button>
        </div>
      {% endfor %}
    
    </form>
  
    <div class="d-flex justify-content-center gap-3">
      <!-- 解答終了 -->
      <a  href="{% url 'home' %}" type="button" class="btn btn-secondary">解答終了</a>
      <!-- 中断 -->
      <form action="{% url 'end_sesion' %}" method="POST">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">中断</button> 
    </div>
</div>

{% endblock %}
