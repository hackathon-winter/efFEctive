<!-- ヘッダー -->
{% load static %}
{% load django_bootstrap5 %}

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>efFEctive</title>
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    {% bootstrap_css %}
    {% bootstrap_javascript %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-dark-subtle sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="">efFEctive</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="modal" data-bs-target="#menuModal" aria-controls="menuModal" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>
    </nav>

    <!-- モーダルウィンドウ -->
    <div class="modal fade" id="menuModal" tabindex="-1" aria-labelledby="menuModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <ul class="nav flex-column align-items-center">
                        <li class="nav-item">
                            <a class="nav-link" aria-current="page" href="">ホーム画面</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="">問題演習</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="">学習履歴</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="">ランキング</a>
                        </li>                     
                        <li class="nav-item">
                            <a class="nav-link" href="">ログアウト</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
    <main>
        {% block content %}{% endblock %}
    </main>
    
</body>
</html>
