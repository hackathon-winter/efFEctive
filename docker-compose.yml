
services:
  db:
    image: postgres
    environment:
      - "POSTGRES_USER=postgres"
      - "POSTGRES_PASSWORD=postgres"
      - "POSTGRES_DB=postgres"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build: .
    command: bash -c "mkdir -p /code/run && python manage.py collectstatic --no-input && uwsgi --ini uwsgi.ini & nginx -g 'daemon off;'"
    volumes:
      - .:/code
      - static_volume:/code/static
    ports:
      - "80:80"
    environment:
      - "DJANGO_DB_HOST=db"
      - "DJANGO_DB_PORT=5432"
      - "DJANGO_DB_NAME=postgres"
      - "DJANGO_DB_USER=postgres"
      - "DJANGO_DB_PASSWORD=postgres"
    env_file:
      - .env    
    depends_on:
      db:
        condition: service_healthy
volumes:
  static_volume: