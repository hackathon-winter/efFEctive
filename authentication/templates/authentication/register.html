<!-- 新規ユーザー登録画面 -->
{% extends 'base.html' %}
{% load static %}
{% block content %}

    

<div class="wrapper">
    <h2 style="text-align: center;">新規ユーザー登録</h2>
    <div class="form-container">
        <form method="POST" action="{% url 'register' %}">
            {% csrf_token %}
                <label for="username" class="form-label">ユーザー名</label>
                <input type="text" class="form-control" name="username" id="username" placeholder="ユーザー名を入力" required>
            
            
                <label for="email" class="form-label">メールアドレス</label>
                <input type="email" class="form-control" name="email" id="email" placeholder="メールアドレスを入力" required>
            
            
                <label for="password" class="form-label">パスワード</label>
                <input type="password" class="form-control" name="password" id="password" placeholder="パスワードを入力" required>
            
                <button type="submit" class="button-primary">登録</button>
        </form>    
        
        <form method="POST" action="{% url 'google_register' %}">
            {% csrf_token %}
            <button type="submit" class="button-secondary">Googleでユーザー登録</button>
        </form>
        <a href="{% url 'login' %}">ログイン画面へ</a>
    </div>
</div>

{% endblock %}
