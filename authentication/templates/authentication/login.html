{% extends 'base.html' %}
{% block content %}

    

<div class="d-flex align-items-center justify-content-center vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow p-4">
                    <h3 class="text-center">ログイン</h3>
                    {% if messages %}
                    <div class="messages">
                        {% for message in messages %}
                        <div{% if message.tags %} class="{{ message.tags }}"{% endif %}>
                            {{ message }}
                        </div>
                        {% endfor %}
                    </div>
                    {% endif %}
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="email" class="form-label">メールアドレス</label>
                            <input type="email" class="form-control" name="email" id="email" placeholder="メールアドレスを入力" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">パスワード</label>
                            <input type="password" class="form-control" name="password" id="password" placeholder="パスワードを入力" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">ログイン</button>
                    </form>
                    <div class="text-center mt-3">
                        <button class="btn btn-secondary w-100" onclick="location.href='#'">Googleでログイン</button>
                    </div>
                    <div class="text-center mt-3">
                        <a href="#">新規ユーザー登録</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<button type="btn" onlick="location.href='../../templates/home.html'">ホーム画面</button>  

{% endblock %}
